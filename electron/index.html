      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }
      function escapeAttr(s) { return escapeHtml(s); }

      // Minimal markdown → HTML renderer for the Preview pane.
      // Source-of-truth stays markdown on disk; this only renders the view.
      function renderMarkdownToHtml(md) {
        const lines = String(md ?? "").replace(/\r\n/g, "\n").split("\n");
        const out = [];
        let i = 0;
        const safeUrl = (u) => {
          const s = String(u || "").trim();
          if (/^(https?:|mailto:|#|\/|\.\/|\.\.\/)/i.test(s)) return s;
          return "#";
        };
        const renderInline = (s) => {
          const codes = [];
          s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000C${codes.length - 1}\u0000`; });
          s = escapeHtml(s);
          s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => `<img alt="${alt}" src="${escapeAttr(safeUrl(src))}">`);
          s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, t, a) => `<a href="#" class="wikilink">${a || t}</a>`);
          s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) => `<a href="${escapeAttr(safeUrl(url))}" target="_blank" rel="noopener">${txt}</a>`);

          s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
          s = s.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
          s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
          s = s.replace(/(^|[^_\w])_([^_\n]+)_/g, "$1<em>$2</em>");
          s = s.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
          s = s.replace(/\u0000C(\d+)\u0000/g, (_, idx) => `<code>${escapeHtml(codes[+idx])}</code>`);
          return s;
        };
        const isListLine = (l) => /^(\s*)([-*+]|\d+\.)\s+/.test(l);
        const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
        const isTableSeparator = (l) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(l);
        const isBlankOrBreak = (l) =>
          /^\s*$/.test(l) || /^#{1,6}\s/.test(l) || /^```/.test(l) || isListLine(l) || /^>\s?/.test(l) || /^(-\s*-\s*-+|\*\s*\*\s*\*+|_\s*_\s*_+)\s*$/.test(l) || isTableRow(l);
        while (i < lines.length) {
          const line = lines[i];
          const fence = line.match(/^```(\w*)\s*$/);
          if (fence) {
            const lang = fence[1];
            const buf = [];
            i++;
            while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
            i++;
            out.push(`<pre><code${lang ? ` class="language-${lang}"` : ""}>${escapeHtml(buf.join("\n"))}</code></pre>`);
            continue;
          }
          const h = line.match(/^(#{1,6})\s+(.*)$/);
          if (h) { out.push(`<h${h[1].length}>${renderInline(h[2])}</h${h[1].length}>`); i++; continue; }
          if (/^\s*(-\s*-\s*-+|\*\s*\*\s*\*+|_\s*_\s*_+)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
          if (/^>\s?/.test(line)) {
            const buf = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
            out.push(`<blockquote>${renderMarkdownToHtml(buf.join("\n"))}</blockquote>`);
            continue;
          }
          if (isListLine(line)) {
            const first = line.match(/^(\s*)([-*+]|\d+\.)\s+/);
            const ordered = /\d+\./.test(first[2]);
            const tag = ordered ? "ol" : "ul";
            const items = [];
            while (i < lines.length && isListLine(lines[i])) {
              const m = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
              let content = m[3];
              const task = content.match(/^\[([ xX])\]\s+(.*)$/);
              if (task) {
                const checked = task[1].toLowerCase() === "x" ? " checked" : "";
                items.push(`<li class="task"><input type="checkbox" disabled${checked}> ${renderInline(task[2])}</li>`);
              } else {
                items.push(`<li>${renderInline(content)}</li>`);
              }
              i++;
            }
            out.push(`<${tag}>${items.join("")}</${tag}>`);
            continue;
          }
          if (isTableRow(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
            const parseRow = (l) => {
              let s = l.trim();
              s = s.replace(/^\|/, "").replace(/\|$/, "");
              return s.split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
            };
            const parseAlign = (l) => {
              let s = l.trim().replace(/^\|/, "").replace(/\|$/, "");
              return s.split("|").map(c => {
                const t = c.trim();
                const L = t.startsWith(":");
                const R = t.endsWith(":");
                if (L && R) return "center";
                if (R) return "right";
                if (L) return "left";
                return "";
              });
            };
            const header = parseRow(line);
            const aligns = parseAlign(lines[i + 1]);
            i += 2;
            const rows = [];
            while (i < lines.length && isTableRow(lines[i]) && !isTableSeparator(lines[i])) {
              rows.push(parseRow(lines[i])); i++;
            }
            const colCount = Math.max(header.length, ...rows.map(r => r.length));
            const pad = (r) => { while (r.length < colCount) r.push(""); return r; };
            const styleAttr = (idx) => aligns[idx] ? ` style="text-align:${aligns[idx]}"` : "";
            const thead = "<thead><tr>" + pad(header).map((c, idx) => `<th${styleAttr(idx)}>${renderInline(c)}</th>`).join("") + "</tr></thead>";
            const tbody = rows.length ? "<tbody>" + rows.map(r => "<tr>" + pad(r).map((c, idx) => `<td${styleAttr(idx)}>${renderInline(c)}</td>`).join("") + "</tr>").join("") + "</tbody>" : "";
            out.push(`<table>${thead}${tbody}</table>`);
            continue;
          }
          if (/^\s*$/.test(line)) { i++; continue; }
          const buf = [line]; i++;
          while (i < lines.length && !isBlankOrBreak(lines[i])) { buf.push(lines[i]); i++; }
          out.push(`<p>${renderInline(buf.join(" "))}</p>`);
        }
        return out.join("\n");
      }

      async function render() {
        document.documentElement.setAttribute('data-view', activeView);
        renderSidebar();
        if (activeView === 'calendar') {
          renderCalendar();
        } else {
          renderList();
          await renderEditor();
        }
      }

      function noteDateFor(n, field) {
        const idx = searchIndex.get(n.relPath);
        const iso = idx && idx[field];
        if (iso) { const d = new Date(iso); if (!isNaN(d)) return d; }
        if (field === 'modified' && n.updatedAt) return new Date(n.updatedAt);
        return null;
      }

      function sameDay(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
      }

      // Calendar source filter: 'both' | 'activity' | 'scheduled'
      let calendarSource = 'both';
      const SCHED_DRAG_MIME = "application/x-brain-schedule";

      function scheduledDateFor(n) {
        const idx = searchIndex.get(n.relPath);
        const iso = idx && idx.scheduled;
        if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
        const [y, m, d] = iso.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return isNaN(dt) ? null : dt;
      }

      function toIsoDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function renderCalendar() {
        const pane = $("calendarPane");
        const year = calendarMonth.getFullYear();
        const month = calendarMonth.getMonth();
        const monthLabel = calendarMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        const today = new Date();

        const firstOfMonth = new Date(year, month, 1);
        // Monday-first: Sun=0 -> 6, Mon=1 -> 0, ...
        const startOffset = (firstOfMonth.getDay() + 6) % 7;
        const gridStart = new Date(year, month, 1 - startOffset);

        // Bucket notes by yyyy-mm-dd. Kind: 'activity' | 'scheduled'.
        // A note can appear as both on the same day (still shown once, marked scheduled).
        const buckets = new Map();
        const seen = new Map(); // key -> Set(relPath) to dedupe scheduled+activity same day
        function push(key, entry) {
          if (!buckets.has(key)) { buckets.set(key, []); seen.set(key, new Map()); }
          const seenMap = seen.get(key);
          const prev = seenMap.get(entry.n.relPath);
          if (prev) {
            if (entry.kind === 'scheduled') prev.kind = 'scheduled';
            return;
          }
          seenMap.set(entry.n.relPath, entry);
          buckets.get(key).push(entry);
        }
        const nonTrash = notes.filter(n => n.category !== TRASH);
        for (const n of nonTrash) {
          if (calendarSource !== 'scheduled') {
            const d = noteDateFor(n, calendarField);
            if (d) {
              const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
              push(key, { n, d, kind: 'activity' });
            }
          }
          if (calendarSource !== 'activity') {
            const s = scheduledDateFor(n);
            if (s) {
              const key = `${s.getFullYear()}-${s.getMonth()}-${s.getDate()}`;
              push(key, { n, d: s, kind: 'scheduled' });
            }
          }
        }

        const weekdays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
        const weekdayHtml = weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join('');

        const MAX_VISIBLE = 3;
        const noteItemHtml = ({ n, kind }) => {
          const cat = catById(n.category);
          const color = cat?.color || '#8e8e93';
          const isSched = kind === 'scheduled';
          const cls = `cal-note${isSched ? ' scheduled' : ''}`;
          const drag = isSched ? 'draggable="true"' : '';
          const glyph = isSched ? '<span class="sched-glyph" title="Scheduled">◷</span>' : `<span class="cat-dot" style="background:${escapeAttr(color)}"></span>`;
          return `<div class="${cls}" data-id="${escapeAttr(n.relPath)}" data-kind="${kind}" ${drag} title="${escapeAttr(n.title || 'Untitled')}${isSched ? ' — scheduled' : ''}">${glyph}<span>${escapeHtml(n.title || 'Untitled')}</span></div>`;
        };

        let cellsHtml = '';
        for (let i = 0; i < 42; i++) {
          const d = new Date(gridStart);
          d.setDate(gridStart.getDate() + i);
          const inMonth = d.getMonth() === month;
          const isToday = sameDay(d, today);
          const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
          const iso = toIsoDate(d);
          const items = (buckets.get(key) || []).sort((a, b) => {
            // scheduled first, then by date desc
            if (a.kind !== b.kind) return a.kind === 'scheduled' ? -1 : 1;
            return b.d - a.d;
          });
          const visible = items.slice(0, MAX_VISIBLE);
          const hidden = items.length - visible.length;
          const notesHtml = visible.map(noteItemHtml).join('');
          const moreHtml = hidden > 0
            ? `<div class="cal-more" data-more="${iso}">+${hidden} more</div>`
            : '';
          cellsHtml += `
            <div class="cal-day ${inMonth ? '' : 'other-month'} ${isToday ? 'today' : ''}" data-iso="${iso}">
              <div class="cal-day-num">${d.getDate()}</div>
              <div class="cal-day-notes">${notesHtml}${moreHtml}</div>
            </div>`;
        }

        const fieldDisabled = calendarSource === 'scheduled';
        pane.innerHTML = `
          <div class="cal-header">
            <button class="cal-nav-btn" id="calPrev" title="Previous month" aria-label="Previous month">‹</button>
            <div class="cal-title">${monthLabel}</div>
            <button class="cal-nav-btn" id="calNext" title="Next month" aria-label="Next month">›</button>
            <button class="cal-today-btn" id="calToday">Today</button>
            <div class="cal-field-toggle" role="tablist" aria-label="Show" style="margin-left:auto">
              <button class="${calendarSource === 'both' ? 'active' : ''}" data-source="both">Both</button>
              <button class="${calendarSource === 'activity' ? 'active' : ''}" data-source="activity">Activity</button>
              <button class="${calendarSource === 'scheduled' ? 'active' : ''}" data-source="scheduled">Scheduled</button>
            </div>
            <div class="cal-field-toggle ${fieldDisabled ? 'disabled' : ''}" role="tablist" aria-label="Activity date field" title="${fieldDisabled ? 'Not applicable in Scheduled view' : ''}">
              <button class="${calendarField === 'modified' ? 'active' : ''}" data-field="modified" ${fieldDisabled ? 'disabled aria-disabled="true"' : ''}>Modified</button>
              <button class="${calendarField === 'created' ? 'active' : ''}" data-field="created" ${fieldDisabled ? 'disabled aria-disabled="true"' : ''}>Created</button>
            </div>
          </div>
          <div class="cal-weekdays">${weekdayHtml}</div>
          <div class="cal-grid">${cellsHtml}</div>
        `;

        // Popover for "+N more"
        function closePopover() {
          document.querySelectorAll('.cal-popover, .cal-popover-backdrop').forEach(el => el.remove());
        }
        pane.querySelectorAll('.cal-more').forEach(m => {
          m.addEventListener('click', (e) => {
            e.stopPropagation();
            closePopover();
            const iso = m.dataset.more;
            const cell = m.closest('.cal-day');
            const key = (() => {
              const [y, mo, da] = iso.split('-').map(Number);
              return `${y}-${mo - 1}-${da}`;
            })();
            const items = (buckets.get(key) || []).sort((a, b) => {
              if (a.kind !== b.kind) return a.kind === 'scheduled' ? -1 : 1;
              return b.d - a.d;
            });
            const backdrop = document.createElement('div');
            backdrop.className = 'cal-popover-backdrop';
            backdrop.onclick = closePopover;
            const pop = document.createElement('div');
            pop.className = 'cal-popover';
            const [y, mo, da] = iso.split('-').map(Number);
            const dt = new Date(y, mo - 1, da);
            pop.innerHTML = `<div class="cal-popover-title">${escapeHtml(dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }))}</div>` + items.map(noteItemHtml).join('');
            document.body.appendChild(backdrop);
            document.body.appendChild(pop);
            const rect = cell.getBoundingClientRect();
            const popW = 240;
            let left = rect.left;
            if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
            let top = rect.bottom + 4;
            const popH = Math.min(320, 40 + items.length * 22);
            if (top + popH > window.innerHeight - 8) top = Math.max(8, rect.top - popH - 4);
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
            pop.querySelectorAll('.cal-note').forEach(el => {
              el.addEventListener('click', async () => {
                const relPath = el.dataset.id;
                const n = notes.find(x => x.relPath === relPath);
                if (!n) return;
                closePopover();
                activeView = 'notes';
                activeCategory = 'all';
                activeId = relPath;
                await render();
              });
              if (el.getAttribute('draggable') === 'true') {
                el.addEventListener('dragstart', (ev) => {
                  ev.stopPropagation();
                  ev.dataTransfer.effectAllowed = 'move';
                  ev.dataTransfer.setData(SCHED_DRAG_MIME, el.dataset.id);
                  try { ev.dataTransfer.setData('text/plain', el.dataset.id); } catch {}
                });
              }
            });
          });
        });

        $("calPrev").onclick = () => { calendarMonth = new Date(year, month - 1, 1); renderCalendar(); };
        $("calNext").onclick = () => { calendarMonth = new Date(year, month + 1, 1); renderCalendar(); };
        $("calToday").onclick = () => {
          const t = new Date(); t.setDate(1); t.setHours(0,0,0,0);
          calendarMonth = t;
          renderCalendar();
        };
        pane.querySelectorAll('[data-field]').forEach(btn => {
          btn.onclick = () => { if (btn.disabled) return; calendarField = btn.dataset.field; renderCalendar(); };
        });
        pane.querySelectorAll('[data-source]').forEach(btn => {
          btn.onclick = () => { calendarSource = btn.dataset.source; renderCalendar(); };
        });
        pane.querySelectorAll('.cal-note').forEach(el => {
          el.addEventListener('click', async (e) => {
            const relPath = el.dataset.id;
            const n = notes.find(x => x.relPath === relPath);
            if (!n) return;
            activeView = 'notes';
            activeCategory = 'all';
            activeId = relPath;
            await render();
          });
          if (el.getAttribute('draggable') === 'true') {
            el.addEventListener('dragstart', (e) => {
              e.stopPropagation();
              e.dataTransfer.effectAllowed = 'move';
              e.dataTransfer.setData(SCHED_DRAG_MIME, el.dataset.id);
              // also set a harmless text fallback (some platforms need any data)
              try { e.dataTransfer.setData('text/plain', el.dataset.id); } catch {}
            });
          }
        });
        pane.querySelectorAll('.cal-day').forEach(cell => {
          cell.addEventListener('dragover', (e) => {
            if (!Array.from(e.dataTransfer.types).includes(SCHED_DRAG_MIME)) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            cell.classList.add('drop-target');
          });
          cell.addEventListener('dragleave', () => cell.classList.remove('drop-target'));
          cell.addEventListener('drop', async (e) => {
            if (!Array.from(e.dataTransfer.types).includes(SCHED_DRAG_MIME)) return;
            e.preventDefault();
            cell.classList.remove('drop-target');
            const relPath = e.dataTransfer.getData(SCHED_DRAG_MIME);
            const iso = cell.dataset.iso;
            if (!relPath || !iso) return;
            const n = notes.find(x => x.relPath === relPath);
            if (!n) return;
            if ((n.frontmatter?.scheduled || null) === iso) return;
            n.frontmatter = n.frontmatter || {};
            n.frontmatter.scheduled = iso;
            const idx = searchIndex.get(relPath);
            if (idx) idx.scheduled = iso;
            renderCalendar();
            try {
              const res = await api.writeNote(relPath, { scheduled: iso, bumpModified: false });
              n.frontmatter = res.frontmatter;
              const idx2 = searchIndex.get(relPath);
              if (idx2) idx2.scheduled = res.frontmatter?.scheduled || null;
            } catch (err) {
              console.error('reschedule failed', err);
            }
          });
        });
      }

      $("newBtn").onclick = newNote;
      $("exportBtn").onclick = doExport;
      $("importBtn").onclick = doImport;
      $("folderBtn").onclick = () => api.reveal("");
      $("themeToggle").onclick = () => {
        themeMode = themeMode === "dark" ? "light" : "dark";
        localStorage.setItem("brain.theme", themeMode);
        applyTheme();
      };
      $("sidebarToggle").onclick = () => {
        sidebarCollapsed = !sidebarCollapsed;
        localStorage.setItem("brain.sidebar", sidebarCollapsed ? "collapsed" : "expanded");
        applySidebar();
      };
      window.addEventListener("beforeunload", () => { flushPending(); });

      // External file changes (edits made outside the app)
      let externalRefreshTimer = null;
      api.onChange?.(({ paths }) => {
        // Invalidate cached body/frontmatter for affected notes
        for (const p of paths || []) {
          const norm = p.split(/[\\/]/).join("/");
          const hit = notes.find(n => n.relPath.split(/[\\/]/).join("/") === norm);
          if (hit) { hit.body = undefined; hit.frontmatter = undefined; }
        }
        clearTimeout(externalRefreshTimer);
        externalRefreshTimer = setTimeout(async () => {
          // Don't clobber an in-progress edit
          if (pending) return;
          await refresh();
        }, 250);
        // Update the search index for the changed paths (fast, no full re-index)
        reindexPaths(paths || []);
      });

      // ---------- Command palette search ----------
      const searchIndex = new Map(); // relPath -> { relPath, title, category, body, hasUnchecked }
      let paletteOpen = false;
      let paletteResults = [];
      let paletteActiveIdx = 0;

      function computeHasUnchecked(body) {
        return /(^|\n)\s*[-*+]\s+\[ \]\s+/.test(body || "");
      }

      async function indexNote(n) {
        try {
          const r = await api.readNote(n.relPath);
          const body = r.body || "";
          if (!pending || pending._for !== n.relPath) n.frontmatter = r.frontmatter;
          searchIndex.set(n.relPath, {
            relPath: n.relPath,
            title: n.title || "",
            category: n.category,
            body,
            created: r.frontmatter?.created || null,
            modified: r.frontmatter?.modified || null,
            scheduled: r.frontmatter?.scheduled || null,
            hasUnchecked: computeHasUnchecked(body),
          });
        } catch {}
      }

      async function rebuildSearchIndex() {
        const nonTrash = notes.filter(n => n.category !== TRASH);
        const seen = new Set(nonTrash.map(n => n.relPath));
        for (const k of [...searchIndex.keys()]) if (!seen.has(k)) searchIndex.delete(k);
        const missing = nonTrash.filter(n => !searchIndex.has(n.relPath));
        await Promise.all(missing.map(indexNote));
        if (paletteOpen) renderPaletteResults();
        if (activeView === 'calendar') renderCalendar();
      }

      async function reindexPaths(paths) {
        for (const p of paths) {
          const norm = p.split(/[\\\\/]/).join("/");
          const n = notes.find(x => x.relPath.split(/[\\\\/]/).join("/") === norm);
          if (!n || n.category === TRASH) { searchIndex.delete(p); continue; }
          await indexNote(n);
        }
        if (paletteOpen) renderPaletteResults();
      }

      function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

      function paletteSearch(q, todoOnly) {
        const items = [...searchIndex.values()];
        const filtered = todoOnly ? items.filter(i => i.hasUnchecked) : items;
        if (!q.trim()) {
          return filtered
            .slice()
            .sort((a, b) => (a.title || "").localeCompare(b.title || ""))
            .slice(0, 50)
            .map(i => ({ ...i, matchIn: "none", matchIdx: -1, score: 0 }));
        }
        const needle = q.toLowerCase();
        const scored = [];
        for (const i of filtered) {
          const t = (i.title || "").toLowerCase();
          const b = (i.body || "").toLowerCase();
          const ti = t.indexOf(needle);
          const bi = b.indexOf(needle);
          if (ti === -1 && bi === -1) continue;
          const score = ti !== -1 ? 1000 - ti : 100 - Math.min(bi, 100);
          scored.push({ ...i, matchIn: ti !== -1 ? "title" : "body", matchIdx: ti !== -1 ? ti : bi, score });
        }
        scored.sort((a, b) => b.score - a.score);
        return scored.slice(0, 50);
      }

      function highlightMatch(text, q) {
        if (!q) return escapeHtml(text);
        const re = new RegExp(escapeRegex(q), "ig");
        let last = 0, out = "", m;
        while ((m = re.exec(text))) {
          out += escapeHtml(text.slice(last, m.index)) + "<mark>" + escapeHtml(m[0]) + "</mark>";
          last = m.index + m[0].length;
          if (m[0].length === 0) re.lastIndex++;
        }
        out += escapeHtml(text.slice(last));
        return out;
      }

      function snippetFor(body, idx, q) {
        if (idx < 0) return "";
        const start = Math.max(0, idx - 32);
        const end = Math.min(body.length, idx + q.length + 80);
        let s = body.slice(start, end).replace(/\s+/g, " ").trim();
        if (start > 0) s = "…" + s;
        if (end < body.length) s = s + "…";
        return highlightMatch(s, q);
      }

      function renderPaletteResults() {
        const q = $("paletteInput").value;
        const todoOnly = $("paletteTodoFilter").checked;
        paletteResults = paletteSearch(q, todoOnly);
        if (paletteActiveIdx >= paletteResults.length) paletteActiveIdx = 0;
        const list = $("paletteList");
        if (!paletteResults.length) {
          list.innerHTML = `<div class="palette-empty">${q || todoOnly ? "No matches" : "Type to search…"}</div>`;
          return;
        }
        list.innerHTML = paletteResults.map((r, i) => {
          const catName = catById(r.category)?.name || r.category;
          let snippet = "";
          if (r.matchIn === "body") snippet = snippetFor(r.body, r.matchIdx, q);
          else {
            const firstLine = (r.body || "").split("\n").find(l => l.trim()) || "";
            snippet = escapeHtml(firstLine.slice(0, 140));
          }
          return `<div class="palette-item ${i === paletteActiveIdx ? "active" : ""}" data-idx="${i}">
            <div><span class="p-title">${highlightMatch(r.title || "Untitled", q)}</span><span class="p-cat">${escapeHtml(catName)}</span></div>
            ${snippet ? `<div class="p-snippet">${snippet}</div>` : ""}
          </div>`;
        }).join("");
        list.querySelectorAll(".palette-item").forEach(el => {
          el.onmouseenter = () => { paletteActiveIdx = +el.dataset.idx; updatePaletteActive(); };
          el.onclick = () => { paletteActiveIdx = +el.dataset.idx; openPaletteSelection(); };
        });
        scrollPaletteActiveIntoView();
      }

      function updatePaletteActive() {
        $("paletteList").querySelectorAll(".palette-item").forEach((el, i) => {
          el.classList.toggle("active", i === paletteActiveIdx);
        });
        scrollPaletteActiveIntoView();
      }
      function scrollPaletteActiveIntoView() {
        const el = $("paletteList").querySelector(".palette-item.active");
        if (el) el.scrollIntoView({ block: "nearest" });
      }

      async function openPalette() {
        paletteOpen = true;
        $("paletteOverlay").classList.add("open");
        $("paletteInput").value = "";
        paletteActiveIdx = 0;
        $("paletteInput").focus();
        renderPaletteResults();
        await rebuildSearchIndex();
      }
      function closePalette() {
        paletteOpen = false;
        $("paletteOverlay").classList.remove("open");
      }

      async function openPaletteSelection() {
        const r = paletteResults[paletteActiveIdx];
        if (!r) return;
        closePalette();
        await flushPending();
        activeCategory = r.category;
        activeId = r.relPath;
        await render();
      }

      $("paletteInput").addEventListener("input", renderPaletteResults);
      $("paletteTodoFilter").addEventListener("change", renderPaletteResults);
      $("paletteInput").addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") { e.preventDefault(); paletteActiveIdx = Math.min(paletteResults.length - 1, paletteActiveIdx + 1); updatePaletteActive(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); paletteActiveIdx = Math.max(0, paletteActiveIdx - 1); updatePaletteActive(); }
        else if (e.key === "Enter") { e.preventDefault(); openPaletteSelection(); }
        else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
      });
      $("paletteOverlay").addEventListener("mousedown", (e) => {
        if (e.target === $("paletteOverlay")) closePalette();
      });
      window.addEventListener("keydown", (e) => {
        const mod = e.metaKey || e.ctrlKey;
        if (mod && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") {
          e.preventDefault();
          if (paletteOpen) closePalette(); else openPalette();
        } else if (e.key === "Escape" && paletteOpen) {
          e.preventDefault();
          closePalette();
        }
      });

      // Warm the search index once the vault is loaded
      const _origRefresh = refresh;
      refresh = async function(selectFirst) {
        await _origRefresh(selectFirst);
        rebuildSearchIndex();
      };

      // Keep the "edited X ago" label fresh
      setInterval(() => {
        const note = notes.find(n => n.relPath === activeId);
        const bar = document.getElementById("metaBar");
        if (note && bar && note.frontmatter?.modified) {
          const el = bar.querySelector(".modified-text");
          if (el) el.textContent = relativeTime(note.frontmatter.modified);
        }
      }, 30000);

      init();
    </script>
  </body>
</html>
